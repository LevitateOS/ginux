# Per-row budgets for `make bench-launch-compare`.
#
#   <row|default> [regression_pct=N] [max_ns_per_op=N] [max_ratio_to_native=N]
#
# regression_pct      allowed slowdown of the median ns/op against the accepted
#                     baseline (or of binary B against binary A in an A/B run).
# max_ns_per_op       optional absolute ceiling on the ginux median, in ns.
# max_ratio_to_native optional absolute ceiling on ginux median / native median.
#
# These are launch-mode rows: every supervised syscall costs microseconds, so
# the Gate 11 4% native budget does not apply (see docs/launch-performance.md).
# No absolute targets are set until an accepted baseline exists; add them
# after reading a run taken on an idle machine, for example:
#   stat_image max_ratio_to_native=40
default regression_pct=10

# Rows dominated by scheduling or process creation vary more between runs.
fork_exec_wait regression_pct=20
futex_pair regression_pct=20
pipe_pingpong regression_pct=20
cc_hello regression_pct=20
