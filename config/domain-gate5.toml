schema_version = 1

[domain]
id = "gate5-demo"
root = "docker.io/rockylinux/rockylinux@sha256:e372170ca8630f0f03e9b70fdd0bf4a3ce3426b0de7cdba615f06337389de176"
init = "/bin/bash"
args = []
environment = ["container=ginux"]

[resources]
# Maximum allowed logical CPUs, restricted within the operator's affinity mask.
vcpus = 1
# Per-process virtual address space; owned storage is separately bounded below.
memory_mib = 256

[execution]
profile = "balanced"
backend = "ptrace-native"

[contract]
profile = "gate5-vfs"

[storage]
assignments = []

[devices]
assignments = []

[network]
backend = "none"

[audit]
mode = "stderr"

[failure]
policy = "stop"
