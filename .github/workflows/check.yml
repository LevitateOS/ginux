name: check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - run: make test-ci-changes
      - name: Compare with the newest commit that passed
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGET_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow check.yml \
            --status success --limit 300 --json headSha --jq '.[].headSha' \
            >"$RUNNER_TEMP/passed" || : >"$RUNNER_TEMP/passed"
          status=0
          ./scripts/ci-changes.sh "$HEAD_SHA" "$RUNNER_TEMP/passed" ${TARGET_SHA:+"$TARGET_SHA"} \
            >>"$GITHUB_OUTPUT" 2>"$RUNNER_TEMP/reason" || status=$?
          cat "$RUNNER_TEMP/reason"
          { echo '```'; cat "$RUNNER_TEMP/reason"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Name checks for documentation-only changes
        if: steps.classify.outputs.code == 'false'
        run: |
          command -v rg >/dev/null || { sudo apt-get update && sudo apt-get install -y ripgrep; }
          make check-name check-instance-terminology

  static-and-unit:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - run: brew install ripgrep
      - run: rustup component add clippy rustfmt
      - run: rustup target add x86_64-unknown-linux-gnu
      - run: make check
      - run: make test-unit
      - run: make test-release-overflow

  launch-integration:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add x86_64-unknown-linux-gnu
      - run: RUSTFLAGS='' CARGO_TARGET_DIR=.artifacts/unit cargo test -p ginux-devices --lib
      - run: make build build-launch-fixture build-launch-storage-fixture build-launch-device-fixture build-launch-pipe-fixture build-launch-fd-fixture build-launch-task-fixture build-launch-exec-fixture build-process-fixtures build-gate1-fixture build-launch-poll-fixture build-launch-directory-fixture build-launch-owned-exec-fixture build-launch-script-fixture build-launch-network-fixture build-launch-thread-fixture build-launch-signal-fixture
      - run: sudo make test-launch
      - run: sudo make test-launch-contract
      - run: sudo make test-launch-storage
      - run: sudo make test-launch-checkpoints
      - run: sudo make test-launch-restore
      - run: sudo make test-launch-devices
      - run: sudo make test-launch-pipes
      - run: sudo make test-launch-fds
      - run: sudo make test-launch-tasks
      - run: sudo make test-launch-threads
      - run: sudo make test-launch-signals
      - run: sudo make test-launch-directories
      - run: sudo make test-launch-exec
      - run: sudo make test-native-supervision
      - run: make test-process-native
      - run: sudo make test-gate1-setup
      - run: sudo make test-launch-poll
      - run: sudo make test-launch-owned-exec
      - run: sudo make test-launch-scripts
      - run: sudo make test-launch-network
      - run: make build-launch-image-io-fixture
      - run: sudo make test-launch-image-io
      - run: sudo make test-tracee-kill
