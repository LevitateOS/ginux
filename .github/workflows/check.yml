name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - run: brew install ripgrep
      - run: rustup component add clippy rustfmt
      - run: rustup target add x86_64-unknown-linux-gnu
      - run: make check
      - run: make test-unit

  launch-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add x86_64-unknown-linux-gnu
      - run: make build build-launch-fixture build-launch-storage-fixture build-launch-device-fixture build-launch-pipe-fixture
      - run: sudo make test-launch
      - run: sudo make test-launch-storage
      - run: sudo make test-launch-devices
      - run: sudo make test-launch-pipes
